site:
  name: Kanso Goods
  site: 'https://kansogoods.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: Kanso Goods – Wholesale Wooden 3D Puzzles & DIY Book Nooks
    template: '%s — Kanso Goods'
  description: "Wholesale B2B supplier of DIY Book Nooks, Miniature Dollhouses & Wooden 3D Mechanical Puzzles. 1-carton trial MOQ, neutral packaging."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Kanso Goods
    images:
    - url: '/product/product-5.jpg'
      width: 1200
      height: 1200
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "light:only" | "dark:only"
